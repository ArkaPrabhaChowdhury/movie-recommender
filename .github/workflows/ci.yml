name: OTT Scout CI

on:
  push:
    branches: [main, agent/**]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile backend and evaluation code
        run: python -m compileall -q movie-recommender-backend evaluation

      - name: Run offline benchmark
        run: python evaluation/run_evaluation.py

      - name: Run Python smoke tests
        run: python -m unittest discover -s evaluation -p "test_*.py"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: movie-recommender-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: movie-recommender-frontend
        run: npm ci

      - name: Lint frontend
        working-directory: movie-recommender-frontend
        run: npm run lint

      - name: Build frontend
        working-directory: movie-recommender-frontend
        run: npm run build

      - name: Audit npm dependencies
        working-directory: movie-recommender-frontend
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r movie-recommender-backend/requirements.txt
        continue-on-error: true
